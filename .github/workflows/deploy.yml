# =============================================================================
# Caller Workflow — Unified Vercel Deployment
# =============================================================================
# Source: Wamocon/github_workflow/examples/caller-production-deploy.yml
#
# Secrets required:
#   - VERCEL_TOKEN      → managed at GitHub Organisation level (already set)
#   - VERCEL_ORG_ID     → managed at GitHub Organisation level (already set)
#   - VERCEL_PROJECT_ID → YOU must add this to your repo's GitHub secrets
#                          (Vercel Project → Settings → General → Project ID)
#
# How it works:
#   pull_request → main/master  →  Vercel *preview* deployment
#   push         → main/master  →  Vercel *production* deployment
#
# Schema (db_schema input):
#   Leave db_schema empty (default) → schema is pulled from Vercel env vars.
#   Pass a value only if you need to override, e.g. "qa" or "live".
# =============================================================================

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress preview deploys on new commits; never cancel production
concurrency:
  group: deploy-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- Resolve deployment parameters ----------------------------------------
  set-vars:
    name: Resolve deployment variables
    runs-on: ubuntu-latest
    outputs:
      vercel_env: ${{ steps.resolve.outputs.vercel_env }}
      vercel_args: ${{ steps.resolve.outputs.vercel_args }}
    steps:
      - name: Resolve vercel_env and vercel_args
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "vercel_env=production" >> $GITHUB_OUTPUT
            echo "vercel_args=--prod" >> $GITHUB_OUTPUT
          else
            echo "vercel_env=preview" >> $GITHUB_OUTPUT
            echo "vercel_args=" >> $GITHUB_OUTPUT
          fi

  # --- Validate required Vercel env vars ------------------------------------
  preflight-vercel-env:
    name: Validate Vercel env configuration
    needs: set-vars
    runs-on: ubuntu-latest
    steps:
      - name: Validate required env vars in Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET_ENV: ${{ needs.set-vars.outputs.vercel_env }}
        run: |
          if [[ -z "$VERCEL_PROJECT_ID" ]]; then
            echo "ERROR: Missing GitHub secret VERCEL_PROJECT_ID"
            exit 1
          fi

          API_URL="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?target=${TARGET_ENV}"
          if [[ -n "$VERCEL_ORG_ID" ]]; then
            API_URL="${API_URL}&teamId=${VERCEL_ORG_ID}"
          fi

          curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" "$API_URL" -o vercel-env.json

          node -e '
            const fs = require("node:fs");
            const required = ["NEXT_PUBLIC_SUPABASE_URL", "NEXT_PUBLIC_SUPABASE_ANON_KEY"];
            const payload = JSON.parse(fs.readFileSync("vercel-env.json", "utf8"));

            if (payload.error) {
              console.error("Vercel API error:", payload.error.message || payload.error.code || JSON.stringify(payload.error));
              process.exit(1);
            }

            const envs = Array.isArray(payload.envs) ? payload.envs : [];
            const available = new Set(envs.map((entry) => entry.key).filter(Boolean));
            const missing = required.filter((key) => !available.has(key));

            if (missing.length > 0) {
              console.error(`Missing required Vercel env vars for target ${process.env.TARGET_ENV}: ${missing.join(", ")}`);
              process.exit(1);
            }

            console.log(`Verified Vercel env for ${process.env.TARGET_ENV}: ${required.join(", ")}`);
          '

  # --- Deploy ---------------------------------------------------------------
  deploy:
    name: Deploy to Vercel
    needs: [set-vars, preflight-vercel-env]
    uses: Wamocon/github_workflow/.github/workflows/deploy-preview.yml@main
    with:
      vercel_env: ${{ needs.set-vars.outputs.vercel_env }}
      vercel_args: ${{ needs.set-vars.outputs.vercel_args }}
      # db_schema: ""        # empty = use value from Vercel Dashboard env vars
      # db_schema: "qa"      # override for repos with non-standard schema names
    secrets: inherit
